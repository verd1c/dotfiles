# kitty — tuned for 2560x1600 @165Hz, NVIDIA dGPU-only, Wayland/Mutter

# ---------- font ----------
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size        11.0

# Ligatures stay on, but break them under the cursor so you can see the
# literal characters — matters when reading disassembly and shellcode.
disable_ligatures cursor

# ---------- rendering / latency ----------
# Your panel is 165Hz => ~6ms per frame. Match repaint to it and drop the
# input coalescing delay to zero for the lowest keypress->photon time.
sync_to_monitor yes
repaint_delay   6
input_delay     0
wayland_enable_ime no

# ---------- scrollback ----------
# You dump large disassembly listings and build logs.
scrollback_lines 100000
scrollback_pager_history_size 256

# ---------- bell / misc ----------
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 4

# ---------- tabs ----------
tab_bar_style powerline
tab_powerline_style slanted

# ---------- RE helpers (hints kitten) ----------
# ctrl+shift+p then a hint label: grab a hex address off the screen.
map ctrl+shift+p>h kitten hints --type regex --regex '(?:0x)?[0-9a-fA-F]{6,16}' --program @
# grab a file path
map ctrl+shift+p>f kitten hints --type path --program @
# grab a hash (md5/sha1/sha256 lengths)
map ctrl+shift+p>s kitten hints --type regex --regex '\b[0-9a-fA-F]{32,64}\b' --program @

# ---------- splits ----------
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=vsplit --cwd=current
# NOTE: ctrl+shift+minus is kitty's built-in decrease-font-size.
# Binding it again does NOT replace the default - kitty appends and the
# LAST definition wins, silently killing font-decrease. Using a free key.
map ctrl+shift+d launch --location=hsplit --cwd=current


# ---------- clipboard ----------
# ctrl+v/ctrl+c to match every other app on the desktop. The shift variants
# still work, so nothing is lost. Two caveats this costs:
#  - ctrl+v was quoted-insert (type it, then a key, to see that key's raw
#    escape sequence - which is how the bindkey lines in zshrc were found).
#    Moved to alt+v there.
#  - copy_or_interrupt, NOT copy_to_clipboard: it copies only when there is
#    a selection and otherwise passes SIGINT through, so ctrl+c can still
#    kill a running process.
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt

# ---------- pane jumping ----------
# ctrl+shift+1..0 already do this by default; alt+N is the same thing on one
# modifier, reachable with the left thumb without leaving the home row.
# N is creation order, not screen position: close a pane and the ones after
# it renumber. ctrl+shift+f7 (jump by letter) is position-based if that bites.
map alt+1 first_window
map alt+2 second_window
map alt+3 third_window
map alt+4 fourth_window
map alt+5 fifth_window
map alt+6 sixth_window
map alt+7 seventh_window
map alt+8 eighth_window
map alt+9 ninth_window
map alt+0 tenth_window

# BEGIN_KITTY_THEME
# Ayu
include current-theme.conf
# END_KITTY_THEME
